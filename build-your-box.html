<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Build Your Own Box — Czera</title>
  <meta name="description" content="Build Your Own Box: create a gift that feels personal. Choose your towels, select your preferred options, and complete your CZERA experience with our signature gift box." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;700&family=Italiana&family=Montserrat:ital,wght@0,200;0,300;0,400;0,500;1,300;1,400&display=swap" />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages/build-box.css" />
</head>
<body>
  <noscript><p class="noscript">Turn on JavaScript to build a box and order by email.</p></noscript>
  <a href="#main" class="skip-link">Skip to content</a>
  <div data-shell-header></div>
  <main id="main" class="box-page container">
    <div class="box-steps">
      <span class="eyebrow">Build Your Own Box</span>
      <h1 class="box-page__title">A gift set that's yours alone.</h1>
      <figure class="box-frame box-frame--mini">
        <img src="assets/img/products/complete-czera-set-2.jpg" alt="A Czera gift box with towels" />
      </figure>
      <fieldset class="box-step"><legend><i>1</i> Choose a colour</legend><div class="box-options" data-options="colour"></div><ul class="box-step__reasons" data-colour-reasons aria-live="polite"></ul><p class="box-step__note" data-colour-note></p></fieldset>
      <fieldset class="box-step"><legend><i>2</i> Choose your towels</legend><div class="box-options" data-options="items"></div></fieldset>
    </div>
    <aside class="box-preview" data-preview>
      <figure class="box-frame box-frame--main">
        <img src="assets/img/products/complete-czera-set-2.jpg" alt="A Czera gift box with towels" />
      </figure>
      <div class="box-preview__body">
        <h2>Your box</h2><ul data-summary id="box-contents"></ul>
        <button type="button" class="box-preview__toggle" data-contents-toggle aria-expanded="false" aria-controls="box-contents">Show contents</button>
        <div aria-live="polite" aria-atomic="true" class="box-preview__live">
          <p class="box-preview__total"><span data-piece-count></span><b data-total></b></p>
          <p class="box-preview__reason" data-reason></p>
        </div>
        <p class="box-preview__free">Box included free</p>
        <button type="button" class="btn btn--ink btn--block" data-add-box>Add box to bag</button>
      </div>
    </aside>
  </main>
  <div data-shell-footer></div>
  <script type="module" src="js/pages/build-box.js"></script>
</body>
</html>
